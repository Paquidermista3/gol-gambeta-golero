onAuthStateChanged(auth,async u=>{stopLobby();stopGame();stopAnswers();state={};lastPodium="";lastResult="";priorCorrect=null;gameRef=null;selected=null;answerDocs=[];gradingId=null;submitted=false;user=u;$('login').hidden=!!u;$('game').hidden=!u;if(!u)return;host=u.uid===hostUID;if(!host&&!players[u.uid]){await signOut(auth);return}{const name=host?'Conductor':players[u.uid];$('identity').replaceChildren(avatar(name,'mini'),document.createTextNode(name));}$('host').hidden=!host;render();stopLobby=onSnapshot(lobby,s=>{season=s.data()?.season||{history:[],seen:[]};standings();if(gameRef&&s.data()?.gameId===gameRef.id){render();return;}stopGame();stopAnswers();if(!s.exists()){gameRef=null;state={};render();return}gameRef=doc(db,'games',s.data().gameId);stopGame=onSnapshot(gameRef,g=>{const old=state.activeQuestionId;state=g.data()||{};$('connection').textContent=g.metadata.fromCache?'Sin conexión / caché':'● Conectado';if(old!==state.activeQuestionId){submitted=false;gradingId=null;$('sent').textContent='';$('response').value='';$('answers').replaceChildren();if(!host&&state.activeQuestionId)getDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid)).then(d=>{if(d.exists()&&d.data().questionId===state.activeQuestionId){submitted=true;$('sent').textContent='Respuesta enviada'}}).catch(()=>{})}render();if(host&&state.status==='grading')prepareGrade().catch(fail)},fail);if(host)stopAnswers=onSnapshot(collection(gameRef,'answers'),s=>{answerDocs=s.docs.map(d=>d.data());showAnswers();renderPublic()},fail)},fail)});
action('reset',async()=>{if(!host||locked())return;if((season.history||[]).length>=30)throw Error('Temporada finalizada.');if(state.used?.length&&state.used.length<10&&!confirm('La fecha incompleta no contará. ¿Descartarla?'))return;if(!confirm('¿Crear una partida nueva?'))return;const id=crypto.randomUUID();await setDoc(doc(db,'games',id),{status:'waiting',prompt:'Elegí una categoría',scores:{Negro:0,Flaco:0,Gordis:0},used:[]});await setDoc(lobby,{gameId:id,season},{merge:true});selected=null;$('selected').textContent='Elegí una casilla';$('prompt').value='';$('solution').value=''});
action('resetSeason',async()=>{if(!host||locked())return;if(!confirm('¿Borrar las clasificaciones, historial y preguntas utilizadas de esta temporada?'))return;if(!confirm('Confirmación final: se iniciará una temporada desde cero. ¿Continuar?'))return;const id=crypto.randomUUID(),next=doc(db,'games',id);await runTransaction(db,async tx=>{const l=(await tx.get(lobby)).data();if(l?.gameId){const old=(await tx.get(doc(db,'games',l.gameId))).data();if(['open','grading'].includes(old?.status))throw Error('Cerrá y corregí la pregunta antes de reiniciar.')}tx.set(next,{status:'waiting',prompt:'Elegí una categoría',scores:{Negro:0,Flaco:0,Gordis:0},used:[]});tx.set(lobby,{gameId:id,season:{history:[],seen:[]}},{merge:true})});selected=null;$('selected').textContent='Elegí una casilla';$('prompt').value='';$('solution').value='';$('bankcount').textContent=''});
action('open',async()=>{if(!host||!gameRef||!selected)throw Error('Creá una partida y elegí una categoría.');const prompt=$('prompt').value.trim(),solutions=$('solution').value.split('|').map(norm).filter(Boolean),seconds=Number($('seconds').value),choice={...selected},id=crypto.randomUUID();if(!prompt||!solutions.length||!Number.isFinite(seconds)||seconds<5||seconds>300)throw Error('Completá los campos.');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();const l=(await tx.get(lobby)).data();const current=l.season||{history:[],seen:[]};if(!g.friendly&&choice.bankId&&(current.seen||[]).includes(choice.bankId))throw Error('Pregunta ya utilizada. Elegí otra.');if(['open','grading'].includes(g.status)||g.used.includes(choice.key))throw Error('Casilla no disponible.');tx.set(doc(db,'questions',id),{solutions});if(!g.friendly&&choice.bankId)tx.update(lobby,{season:{...current,seen:[...(current.seen||[]),choice.bankId]}});tx.update(gameRef,{status:'open',prompt,activeQuestionId:id,points:choice.points,activeKey:choice.key,deadline:Timestamp.fromMillis(Date.now()+seconds*1000),duration:seconds,reveal:'',publicResults:{}})});selected=null;$('selected').textContent='Pregunta abierta';$('prompt').value='';$('solution').value='';beep(800)});

let valid=[],awards={},gradedAnswers={};async function prepareGrade(){const id=state.activeQuestionId;if(!host||state.status!=='grading'||gradingId===id)return;gradingId=id;try{const q=await getDoc(doc(db,'questions',id)),snap=await getDocs(collection(gameRef,'answers'));if(state.activeQuestionId!==id)return;valid=q.data().solutions;awards={};gradedAnswers={};$('answers').replaceChildren();const heading=document.createElement('p');heading.textContent='Solución: '+valid.join(' / ');$('answers').append(heading);for(const [uid,name] of Object.entries(players)){const a=snap.docs.map(d=>d.data()).find(a=>a.questionId===id&&a.uid===uid),row=document.createElement('div');row.className='answer';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=!!a&&valid.includes(norm(a.answer));check.disabled=!a;gradedAnswers[name]=a?.answer||'';awards[name]=check.checked;check.onchange=()=>awards[name]=check.checked;label.append(check,document.createTextNode(' '+name+': '+(a?.answer||'Sin respuesta')));row.append(label);$('answers').append(row)}$('grade').hidden=false}catch(e){gradingId=null;throw e}}
action('grade',async()=>{if(!host||state.status!=='grading'||gradingId!==state.activeQuestionId)return;const id=gradingId,chosen={...awards},solution=valid.join(' / ');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(g.status!=='grading'||g.activeQuestionId!==id)throw Error('Corrección ya realizada.');const l=(await tx.get(lobby)).data();const current=l.season||{history:[],seen:[]};const scores={...g.scores},stats=structuredClone(g.stats||{});for(const n in chosen){stats[n]||={correct:0,categories:{}};const cat=g.activeKey.split('-')[0];stats[n].categories[cat]||={correct:0,total:0};stats[n].categories[cat].total++;if(chosen[n]){scores[n]+=g.points;stats[n].correct++;stats[n].categories[cat].correct++}}const used=[...g.used,g.activeKey];tx.update(gameRef,{scores,stats,status:'closed',used,reveal:solution,publicResults:Object.fromEntries(names.map(n=>[n,{answer:gradedAnswers[n]||'',correct:!!chosen[n]}]))});if(!g.friendly&&used.length===10&&!current.history.some(h=>h.id===gameRef.id)){tx.update(lobby,{season:{...current,history:[...current.history,{id:gameRef.id,date:current.history.length+1,scores,stats}]}})}});beep(950)});

function renderPublic(){const el=$('publicResults'),st=$('responseStatus');el.replaceChildren();st.replaceChildren();if(state.status==='closed'&&state.publicResults){for(const n of names){const r=state.publicResults[n];if(!r)continue;const p=document.createElement('p');p.textContent=(r.correct?'✓ ':'✗ ')+n+': '+(r.answer||'Sin respuesta');el.append(p)}}if(host&&state.status==='open'){for(const [uid,n] of Object.entries(players)){const p=document.createElement('p');p.textContent=n+': '+(answerDocs.some(a=>a.uid===uid&&a.questionId===state.activeQuestionId)?'✓ Respondió':'Pensando…');st.append(p)}}}
function profile(n){const el=$('profileContent');el.replaceChildren(avatar(n));const h=document.createElement('h2');h.textContent=n+' · '+({Negro:'Atlanta',Flaco:'River Plate',Gordis:'Boca Juniors'}[n]);el.append(h);const hist=season.history||[],total=hist.reduce((a,x)=>a+(x.scores[n]||0),0),correct=hist.reduce((a,x)=>a+(x.stats?.[n]?.correct||0),0),wins=hist.filter(x=>names.every(m=>m===n||x.scores[n]>x.scores[m])).length;function line(t){const p=document.createElement('p');p.textContent=t;el.append(p)}line(`${total} puntos · ${wins} victorias · ${hist.length?Math.round(correct/(hist.length*10)*100)+'%':'—'} aciertos`);for(const k of ['Gol','Gambeta','Golero','Bonus']){let a=0,b=0;for(const x of hist){const c=x.stats?.[n]?.categories?.[k];a+=c?.correct||0;b+=c?.total||0}line(k+': '+a+'/'+b);const bar=document.createElement('progress');bar.max=b||1;bar.value=a;el.append(bar)}line('Últimas fechas: '+(hist.slice(-5).map(x=>x.scores[n]).join(' · ')||'Sin fechas'));const badges=[];if(hist.some(x=>x.scores[n]===37))badges.push('🎯 Fecha perfecta');if(correct>=100)badges.push('🧠 Enciclopedia');if(hist.some((x,i)=>i>=2&&hist.slice(i-2,i+1).every(y=>names.every(m=>m===n||y.scores[n]>y.scores[m]))))badges.push('🏅 Triplete');line('Logros: '+(badges.join(' · ')||'Todavía sin logros'));$('profile').showModal()}
$('profileClose').onclick=()=>$('profile').close();$('share').onclick=async()=>{const text='⚽ Gol Gambeta Golero · '+(state.friendly?'Amistoso':'Campeonato')+'\n'+names.map(n=>n+': '+(state.scores?.[n]||0)+' pts').join('\n');try{if(navigator.share){let file;try{const r=await fetch('ggg-escudo.jpg');if(r.ok)file=new File([await r.blob()],'GGG.jpg',{type:'image/jpeg'})}catch{};if(file&&navigator.canShare?.({files:[file]}))await navigator.share({text,files:[file]});else await navigator.share({text})}else await navigator.clipboard.writeText(text)}catch(e){if(e.name!=='AbortError')fail(e)}};
