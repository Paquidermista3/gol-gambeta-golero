*{box-sizing:border-box}body{margin:0;background:#08192d;color:#fff;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{font-size:clamp(28px,6vw,48px);line-height:1;color:#c1ff00;margin:12px 0}small{color:#aab9ce}section,.panel{background:#102840;padding:16px;border-radius:16px;margin:12px 0}button,input,select,textarea{font:inherit;border-radius:10px;padding:12px;margin:5px 0}button{background:#c1ff00;color:#08192d;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.35}input,select,textarea{width:100%;background:#173451;color:white;border:1px solid #52677d}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tile{background:#173451;color:#c1ff00;font-size:28px;min-height:65px}.bonus{background:#e8bf62;width:100%}.score{font-size:32px;color:#c1ff00;font-weight:900}.sticky{position:sticky;top:0;z-index:2;box-shadow:0 4px 12px #0005}.clock{font-size:38px;font-weight:900;text-align:center;color:#c1ff00}progress{width:100%;accent-color:#c1ff00}.used{text-decoration:line-through}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{flex:1}.answer{padding:10px;border-bottom:1px solid #52677d}#message{color:#ffca75;white-space:pre-wrap}[hidden]{display:none!important}#podium{text-align:center;font-size:24px;color:#e8bf62}#question{font-size:clamp(22px,4vw,32px)}
</style><main><h1>GOL · GAMBETA · GOLERO</h1><small>EL DESAFÍO FUTBOLÍSTICO / 3.0 beta 1</small><section id="login"><h2>Ingresar</h2><select id="role"><option value="conductor">Conductor</option><option value="negro">Negro</option><option value="flaco">Flaco</option><option value="gordis">Gordis</option></select><input id="password" type="password" placeholder="Contraseña"><button id="enter">Ingresar</button></section><div id="game" hidden><div class="row"><strong id="identity"></strong><small id="connection"></small><button id="logout">Salir</button></div><div id="scores" class="panel grid sticky"></div><div class="panel"><small id="round"></small><div id="board" class="grid"></div><button id="bonus" class="bonus">★ BONUS · 10 PUNTOS</button></div><div class="panel"><small id="category"></small><h2 id="question">Esperando una partida</h2><div id="clock" class="clock"></div><progress id="bar" hidden></progress><p id="reveal"></p><div id="player" hidden><input id="response" maxlength="300" placeholder="Tu respuesta"><button id="send">Enviar respuesta</button><p id="sent"></p></div><div id="podium"></div></div><section><h2>Campeonato</h2><div id="standings"></div><h3>Historial</h3><div id="history"></div></section><div id="host" hidden><section><h2>Control del conductor</h2><p id="selected">Elegí una casilla</p><small>Banco inicial · selección automática editable <span id="bankcount"></span><button id="reroll" type="button">Otra pregunta</button><button id="manual" type="button">Carga manual</button></small><textarea id="prompt" placeholder="Pregunta"></textarea><input id="solution" placeholder="Respuestas válidas separadas por |"><label>Tiempo (segundos)</label><input id="seconds" type="number" value="30" min="5" max="300"><div class="row"><button id="open">Abrir pregunta</button><button id="close">Cerrar y corregir</button></div><div id="answers"></div><button id="grade" hidden>Confirmar puntuación</button></section><button id="reset">Nueva partida</button></div></d const names=Object.values(players);let season={history:[],seen:[]};
function standings(){const rows=names.map(n=>({n,total:0,league:0,wins:0,correct:0,played:0}));for(const h of season.history||[]){for(const r of rows){r.total+=h.scores[r.n]||0;const higher=names.filter(n=>h.scores[n]>h.scores[r.n]).length;const tied=names.filter(n=>h.scores[n]===h.scores[r.n]).length;r.league+=([3,1,0].slice(higher,higher+tied).reduce((a,b)=>a+b,0))/tied;r.wins+=higher===0?1:0;r.correct+=h.stats?.[r.n]?.correct||0;r.played+=10}}const el=$('standings');el.replaceChildren();for(const [label,key] of [['Puntos acumulados','total'],['Puntos de campeonato','league']]){const h=document.createElement('h3');h.textContent=label;el.append(h);for(const r of [...rows].sort((a,b)=>b[key]-a[key])){const d=document.createElement('p');d.textContent=`${r.n}: ${Number(r[key].toFixed(2))} · Aciertos ${r.played?Math.round(100*r.correct/r.played):0}%`;el.append(d)}}$('history').replaceChildren();for(const h of [...(season.history||[])].reverse()){const d=document.createElement('p');d.textContent=`Fecha ${h.date}: `+names.map(n=>n+' '+h.scores[n]).join(' · ');$('history').append(d)}}
let user,host=false,state={},gameRef,selected,busy=false,stopLobby=()=>{},stopGame=()=>{},stopAnswers=()=>{},answerDocs=[],gradingId=null,submitted=false,bankIndex={},audio,lastTick=null;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim().replace(/\s+/g,' ');const fail=e=>$('message').textContent=e.message;const locked=()=>['open','grading'].includes(state.status);function beep(freq=600){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}function action(id,fn){$(id).onclick=async()=>{if(busy)return;busy=true;$('message').textContent='';try{await fn()}catch(e){fail(e)}finally{busy=false}}}
action('enter',async()=>{beep();await signInWithEmailAndPassword(auth,$('role').value+'@ggg.example',$('password').value);$('password').value=''});action('logout',()=>signOut(auth));
function fillBank(exclude=null){if(!selected)return;const pool=BANK.filter(x=>x.key===selected.key&&!(season.seen||[]).includes(x.id)&&x.id!==exclude);const q=pool[Math.floor(Math.random()*pool.length)];selected.bankId=q?.id||null;$('prompt').value=q?.q||'';$('solution').value=q?.a||'';$('bankcount').textContent=q?` · ${pool.length} disponibles`:' · Sin preguntas disponibles; carga manual';}
function choose(c,p){selected={category:c,points:p,key:c+'-'+p};$('selected').textContent=c+' · '+p+' puntos';$('seconds').value=({1:20,3:30,5:40,10:60})[p];fillBank();$('reroll').disabled=false;$('manual').disabled=false}
action('reroll',async()=>{if(!host||locked()||!selected)return;fillBank(selected.bankId)});action('manual',async()=>{if(!host||locked()||!selected)return;selected.bankId=null;$('prompt').value='';$('solution').value='';$('prompt').focus()});
function board(){ $('board').replaceChildren();for(const c of ['Gol','Gambeta','Golero']){const h=document.createElement('strong');h.textContent=c;$('board').append(h)}for(const p of [1,3,5])for(const c of ['Gol','Gambeta','Golero']){const b=document.createElement('button'),used=(state.used||[]).includes(c+'-'+p);b.className='tile'+(used?' used':'');b.textContent=used?'✓':p;b.disabled=!host||!gameRef||locked()||used;b.onclick=()=>choose(c,p);$('board').append(b)}$('bonus').disabled=!host||!gameRef||locked()||(state.used||[]).includes('Bonus-10')}
$('bonus').onclick=()=>choose('Bonus',10);
function render(){const scores=Object.entries(state.scores||{Negro:0,Flaco:0,Gordis:0}).sort((a,b)=>b[1]-a[1]);$('scores').replaceChildren();for(const [name,points] of scores){const d=document.createElement('div'),n=document.createElement('strong'),s=document.createElement('div');n.textContent=name;s.className='score';s.textContent=points;d.append(n,s);$('scores').append(d)}$('round').textContent=`FECHA ${Math.min(30,(season.history||[]).length+(state.used?.length===10?0:1))}/30 · ${state.used?.length||0}/10 preguntas completadas`;$('question').textContent=state.prompt||'Esperando una partida';$('category').textContent=state.activeKey||'';$('player').hidden=host||state.status!=='open';$('reveal').textContent=state.status==='closed'&&state.reveal?'Solución: '+state.reveal:'';$('open').disabled=locked();$('reroll').disabled=locked()||!selected;$('manual').disabled=locked()||!selected;$('close').disabled=state.status!=='open';$('reset').disabled=locked();$('podium').textContent=state.used?.length===10?'🏆 '+scores.filter(x=>x[1]===scores[0][1]).map(x=>x[0]).join(' y ')+' · '+scores[0][1]+' puntos':'';board();if(host)showAnswers()}
function showAnswers(){if(state.status==='grading')return;const el=$('answers');el.replaceChildren();for(const a of answerDocs.filter(a=>a.questionId===state.activeQuestionId)){const p=document.createElement('p');p.textContent=players[a.uid]+': '+a.answer;el.append(p)}$('grade').hidden=true}
onAuthStateChanged(auth,async u=>{stopLobby();stopGame();stopAnswers();state={};gameRef=null;selected=null;answerDocs=[];gradingId=null;submitted=false;user=u;$('login').hidden=!!u;$('game').hidden=!u;if(!u)return;host=u.uid===hostUID;if(!host&&!players[u.uid]){await signOut(auth);return}$('identity').textContent=host?'Conductor':players[u.uid];$('host').hidden=!host;render();stopLobby=onSnapshot(lobby,s=>{season=s.data()?.season||{history:[],seen:[]};standings();if(gameRef&&s.data()?.gameId===gameRef.id)return;stopGame();stopAnswers();if(!s.exists()){gameRef=null;state={};render();return}gameRef=doc(db,'games',s.data().gameId);stopGame=onSnapshot(gameRef,g=>{const old=state.activeQuestionId;state=g.data()||{};$('connection').textContent=g.metadata.fromCache?'Sin conexión / caché':'● Conectado';if(old!==state.activeQuestionId){submitted=false;gradingId=null;$('sent').textContent='';$('response').value='';$('answers').replaceChildren();if(!host&&state.activeQuestionId)getDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid)).then(d=>{if(d.exists()&&d.data().questionId===state.activeQuestionId){submitted=true;$('sent').textContent='Respuesta enviada'}}).catch(()=>{})}render();if(host&&state.status==='grading')prepareGrade().catch(fail)},fail);if(host)stopAnswers=onSnapshot(collection(gameRef,'answers'),s=>{answerDocs=s.docs.map(d=>d.data());showAnswers()},fail)},fail)});
action('reset',async()=>{if(!host||locked())return;if((season.history||[]).length>=30)throw Error('Temporada finalizada.');if(state.used?.length&&state.used.length<10&&!confirm('La fecha incompleta no contará. ¿Descartarla?'))return;if(!confirm('¿Crear una partida nueva?'))return;const id=crypto.randomUUID();await setDoc(doc(db,'games',id),{status:'waiting',prompt:'Elegí una categoría',scores:{Negro:0,Flaco:0,Gordis:0},used:[]});await setDoc(lobby,{gameId:id,season},{merge:true});selected=null;$('selected').textContent='Elegí una casilla';$('prompt').value='';$('solution').value=''});
action('open',async()=>{if(!host||!gameRef||!selected)throw Error('Creá una partida y elegí una categoría.');const prompt=$('prompt').value.trim(),solutions=$('solution').value.split('|').map(norm).filter(Boolean),seconds=Number($('seconds').value),choice={...selected},id=crypto.randomUUID();if(!prompt||!solutions.length||!Number.isFinite(seconds)||seconds<5||seconds>300)throw Error('Completá los campos.');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();const l=(await tx.get(lobby)).data();const current=l.season||{history:[],seen:[]};if(choice.bankId&&(current.seen||[]).includes(choice.bankId))throw Error('Pregunta ya utilizada. Elegí otra.');if(['open','grading'].includes(g.status)||g.used.includes(choice.key))throw Error('Casilla no disponible.');tx.set(doc(db,'questions',id),{solutions});if(choice.bankId)tx.update(lobby,{season:{...current,seen:[...(current.seen||[]),choice.bankId]}});tx.update(gameRef,{status:'open',prompt,activeQuestionId:id,points:choice.points,activeKey:choice.key,deadline:Timestamp.fromMillis(Date.now()+seconds*1000),duration:seconds,reveal:''})});selected=null;$('selected').textContent='Pregunta abierta';$('prompt').value='';$('solution').value='';beep(800)});
action('send',async()=>{if(host||!gameRef||state.status!=='open'||submitted||Date.now()>=state.deadline.toMillis())return;const answer=$('response').value.trim();if(!answer)return;await setDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid),{uid:user.uid,questionId:state.activeQuestionId,answer,submittedAt:serverTimestamp()});submitted=true;$('sent').textContent='Respuesta enviada';$('response').value='';beep()});
action('close',async()=>{if(!host||!gameRef)return;const id=state.activeQuestionId;await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(g.status!=='open'||g.activeQuestionId!==id)throw Error('Pregunta cerrada.');tx.update(gameRef,{status:'grading'})});await prepareGrade()});
let valid=[],awards={};async function prepareGrade(){const id=state.activeQuestionId;if(!host||state.status!=='grading'||gradingId===id)return;gradingId=id;try{const q=await getDoc(doc(db,'questions',id)),snap=await getDocs(collection(gameRef,'answers'));if(state.activeQuestionId!==id)return;valid=q.data().solutions;awards={};$('answers').replaceChildren();const heading=document.createElement('p');heading.textContent='Solución: '+valid.join(' / ');$('answers').append(heading);for(const [uid,name] of Object.entries(players)){const a=snap.docs.map(d=>d.data()).find(a=>a.questionId===id&&a.uid===uid),row=document.createElement('div');row.className='answer';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=!!a&&valid.includes(norm(a.answer));check.disabled=!a;awards[name]=check.checked;check.onchange=()=>awards[name]=check.checked;label.append(check,document.createTextNode(' '+name+': '+(a?.answer||'Sin respuesta')));row.append(label);$('answers').append(row)}$('grade').hidden=false}catch(e){gradingId=null;throw e}}
action('grade',async()=>{if(!host||state.status!=='grading'||gradingId!==state.activeQuestionId)return;const id=gradingId,chosen={...awards},solution=valid.join(' / ');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(g.status!=='grading'||g.activeQuestionId!==id)throw Error('Corrección ya realizada.');const l=(await tx.get(lobby)).data();const current=l.season||{history:[],seen:[]};const scores={...g.scores},stats=structuredClone(g.stats||{});for(const n in chosen){stats[n]||={correct:0,categories:{}};const cat=g.activeKey.split('-')[0];stats[n].categories[cat]||={correct:0,total:0};stats[n].categories[cat].total++;if(chosen[n]){scores[n]+=g.points;stats[n].correct++;stats[n].categories[cat].correct++}}const used=[...g.used,g.activeKey];tx.update(gameRef,{scores,stats,status:'closed',used,reveal:solution});if(used.length===10&&!current.history.some(h=>h.id===gameRef.id)){tx.update(lobby,{season:{...current,history:[...current.history,{id:gameRef.id,date:current.history.length+1,scores,stats}]}})}});beep(950)});
setInterval(()=>{const open=state.status==='open',remaining=Math.max(0,Math.ceil(((state.deadline?.toMillis()||0)-Date.now())/1000));$('clock').textContent=open?(remaining?remaining+' s':'¡Tiempo!'):'';$('bar').hidden=!open;$('bar').max=state.duration||30;$('bar').value=remaining;$('send').disabled=!open||remaining===0||submitted;if(open&&remaining!==lastTick&&remaining<=5&&lastTick!==null)beep(remaining?440:220);lastTick=open?remaining:null},250);
