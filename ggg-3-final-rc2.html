const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim().replace(/\s+/g,' ');const fail=e=>$('message').textContent=e.message;const locked=()=>['open','grading'].includes(state.status);function beep(freq=600){if(!soundEnabled)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}function action(id,fn){$(id).onclick=async()=>{if(busy)return;busy=true;$('message').textContent='';try{await fn()}catch(e){fail(e)}finally{busy=false}}}

let lastPodium='',lastResult='',priorCorrect=null;function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<45;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#c1ff00','#e8bf62','#fff','#75b9e7'][i%4];e.style.setProperty('--dx',(Math.random()*180-90)+'px');e.style.animationDelay=Math.random()*.6+'s';document.body.append(e);setTimeout(()=>e.remove(),3400)}}
function showPodium(scores){const el=$('podium');if(state.used?.length!==10){el.replaceChildren();lastPodium='';return}const key=gameRef?.id||'';if(lastPodium===key&&el.childElementCount)return;const fresh=lastPodium!==key;lastPodium=key;el.replaceChildren();const h=document.createElement('h3');h.textContent='🏆 Final de la fecha';el.append(h);const grid=document.createElement('div');grid.className='podiumGrid';for(const [name,points] of scores){const rank=1+scores.filter(x=>x[1]>points).length;const d=document.createElement('div');d.className='podiumPlace'+(rank===1?' first':'');d.append(avatar(name));const label=document.createElement('div');label.textContent=['🥇','🥈','🥉'][rank-1]+' '+name;const pts=document.createElement('strong');pts.textContent=points+' pts';d.append(label,pts);grid.append(d)}el.append(grid);if(fresh){celebrate();[660,880,1040].forEach((f,i)=>setTimeout(()=>beep(f),i*150))}}

function board(){ $('board').replaceChildren();for(const c of ['Gol','Gambeta','Golero']){const h=document.createElement('strong');h.textContent=c;$('board').append(h)}for(const p of [1,3,5])for(const c of ['Gol','Gambeta','Golero']){const b=document.createElement('button'),used=(state.used||[]).includes(c+'-'+p);b.className='tile'+(used?' used':'');b.textContent=used?'✓':p;b.disabled=!host||!gameRef||locked()||used;b.onclick=()=>choose(c,p);$('board').append(b)}$('bonus').disabled=!host||!gameRef||locked()||(state.used||[]).includes('Bonus-10')}

function render(){const scores=Object.entries(state.scores||{Negro:0,Flaco:0,Gordis:0}).sort((a,b)=>b[1]-a[1]);$('scores').replaceChildren();for(const name of ['Negro','Flaco','Gordis']){const points=state.scores?.[name]||0;const d=document.createElement('div'),n=document.createElement('strong'),s=document.createElement('div');n.textContent=name;s.className='score';s.textContent=points;d.append(avatar(name),n,s);$('scores').append(d)}$('round').textContent=`${(season.history||[]).length}/30 fechas disputadas · FECHA ${Math.min(30,(season.history||[]).length+(state.used?.length===10?0:1))}/30 · ${state.used?.length||0}/10 preguntas completadas · ${10-(state.used?.length||0)} restantes`;$('question').textContent=state.prompt||'Esperando una partida';$('category').textContent=state.activeKey||'';$('player').hidden=host||state.status!=='open';$('reveal').textContent=state.status==='closed'&&state.reveal?'Solución: '+state.reveal:'';$('open').disabled=locked();$('reroll').disabled=locked()||!selected;$('manual').disabled=locked()||!selected;$('close').disabled=state.status!=='open';$('reset').disabled=locked();$('resetSeason').disabled=locked();$('dateProgress').value=state.used?.length||0;showPodium(scores);if(state.status==='closed'&&state.activeQuestionId&&lastResult!==state.activeQuestionId){lastResult=state.activeQuestionId;if(!host&&user){const correct=state.stats?.[players[user.uid]]?.correct||0;const previous=priorCorrect; if(previous!==null)beep(correct>previous?880:220)}}if(state.status==='open'&&!host&&user)priorCorrect=state.stats?.[players[user.uid]]?.correct||0;board();if(host)showAnswers()}

onAuthStateChanged(auth,async u=>{stopLobby();stopGame();stopAnswers();state={};lastPodium="";lastResult="";priorCorrect=null;gameRef=null;selected=null;answerDocs=[];gradingId=null;submitted=false;user=u;$('login').hidden=!!u;$('game').hidden=!u;if(!u)return;host=u.uid===hostUID;if(!host&&!players[u.uid]){await signOut(auth);return}{const name=host?'Conductor':players[u.uid];$('identity').replaceChildren(avatar(name,'mini'),document.createTextNode(name));}$('host').hidden=!host;render();stopLobby=onSnapshot(lobby,s=>{season=s.data()?.season||{history:[],seen:[]};standings();if(gameRef&&s.data()?.gameId===gameRef.id){render();return;}stopGame();stopAnswers();if(!s.exists()){gameRef=null;state={};render();return}gameRef=doc(db,'games',s.data().gameId);stopGame=onSnapshot(gameRef,g=>{const old=state.activeQuestionId;state=g.data()||{};$('connection').textContent=g.metadata.fromCache?'Sin conexión / caché':'● Conectado';if(old!==state.activeQuestionId){submitted=false;gradingId=null;$('sent').textContent='';$('response').value='';$('answers').replaceChildren();if(!host&&state.activeQuestionId)getDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid)).then(d=>{if(d.exists()&&d.data().questionId===state.activeQuestionId){submitted=true;$('sent').textContent='Respuesta enviada'}}).catch(()=>{})}render();if(host&&state.status==='grading')prepareGrade().catch(fail)},fail);if(host)stopAnswers=onSnapshot(collection(gameRef,'answers'),s=>{answerDocs=s.docs.map(d=>d.data());showAnswers()},fail)},fail)});
action('reset',async()=>{if(!host||locked())return;if((season.history||[]).length>=30)throw Error('Temporada finalizada.');if(state.used?.length&&state.used.length<10&&!confirm('La fecha incompleta no contará. ¿Descartarla?'))return;if(!confirm('¿Crear una partida nueva?'))return;const id=crypto.randomUUID();await setDoc(doc(db,'games',id),{status:'waiting',prompt:'Elegí una categoría',scores:{Negro:0,Flaco:0,Gordis:0},used:[]});await setDoc(lobby,{gameId:id,season},{merge:true});selected=null;$('selected').textContent='Elegí una casilla';$('prompt').value='';$('solution').value=''});

action('open',async()=>{if(!host||!gameRef||!selected)throw Error('Creá una partida y elegí una categoría.');const prompt=$('prompt').value.trim(),solutions=$('solution').value.split('|').map(norm).filter(Boolean),seconds=Number($('seconds').value),choice={...selected},id=crypto.randomUUID();if(!prompt||!solutions.length||!Number.isFinite(seconds)||seconds<5||seconds>300)throw Error('Completá los campos.');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();const l=(await tx.get(lobby)).data();const current=l.season||{history:[],seen:[]};if(choice.bankId&&(current.seen||[]).includes(choice.bankId))throw Error('Pregunta ya utilizada. Elegí otra.');if(['open','grading'].includes(g.status)||g.used.includes(choice.key))throw Error('Casilla no disponible.');tx.set(doc(db,'questions',id),{solutions});if(choice.bankId)tx.update(lobby,{season:{...current,seen:[...(current.seen||[]),choice.bankId]}});tx.update(gameRef,{status:'open',prompt,activeQuestionId:id,points:choice.points,activeKey:choice.key,deadline:Timestamp.fromMillis(Date.now()+seconds*1000),duration:seconds,reveal:''})});selected=null;$('selected').textContent='Pregunta abierta';$('prompt').value='';$('solution').value='';beep(800)});

let valid=[],awards={};async function prepareGrade(){const id=state.activeQuestionId;if(!host||state.status!=='grading'||gradingId===id)return;gradingId=id;try{const q=await getDoc(doc(db,'questions',id)),snap=await getDocs(collection(gameRef,'answers'));if(state.activeQuestionId!==id)return;valid=q.data().solutions;awards={};$('answers').replaceChildren();const heading=document.createElement('p');heading.textContent='Solución: '+valid.join(' / ');$('answers').append(heading);for(const [uid,name] of Object.entries(players)){const a=snap.docs.map(d=>d.data()).find(a=>a.questionId===id&&a.uid===uid),row=document.createElement('div');row.className='answer';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=!!a&&valid.includes(norm(a.answer));check.disabled=!a;awards[name]=check.checked;check.onchange=()=>awards[name]=check.checked;label.append(check,document.createTextNode(' '+name+': '+(a?.answer||'Sin respuesta')));row.append(label);$('answers').append(row)}$('grade').hidden=false}catch(e){gradingId=null;throw e}}
