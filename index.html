</style><main><h1>GOL · GAMBETA · GOLERO</h1><small>EL DESAFÍO FUTBOLÍSTICO / 2.0</small><section id="login"><h2>Ingresar</h2><select id="role"><option value="conductor">Conductor</option><option value="negro">Negro</option><option value="flaco">Flaco</option><option value="gordis">Gordis</option></select><input id="password" type="password" placeholder="Contraseña"><button id="enter">Ingresar</button></section><div id="game" hidden><div class="row"><strong id="identity"></strong><small id="connection"></small><button id="logout">Salir</button></div><div id="scores" class="panel grid sticky"></div><div class="panel"><small id="round"></small><div id="board" class="grid"></div><button id="bonus" class="bonus">★ BONUS · 10 PUNTOS</button></div><div class="panel"><small id="category"></small><h2 id="question">Esperando una partida</h2><div id="clock" class="clock"></div><progress id="bar" hidden></progress><p id="reveal"></p><div id="player" hidden><input id="response" maxlength="300" placeholder="Tu respuesta"><button id="send">Enviar respuesta</button><p id="sent"></p></div><div id="podium"></div></div><div id="host" hidden><section><h2>Control del conductor</h2><p id="selected">Elegí una casilla</p><button id="random">Otra pregunta del banco</button><textarea id="prompt" placeholder="Pregunta"></textarea><input id="solution" placeholder="Respuestas válidas separadas por |"><label>Tiempo (segundos)</label><input id="seconds" type="number" value="30" min="5" max="300"><div class="row"><button id="open">Abrir pregunta</button><button id="close">Cerrar y corregir</button></div><div id="answers"></div><button id="grade" hidden>Confirmar puntuación</button></section><button id="reset">Nueva partida</button></div></div><p id="message" role="alert"></p></main>
<script type="module">

const app=initializeApp({apiKey:'AIzaSyBRm3fWKSPeUrBHssoWGOJIiLMCedGW7a8',authDomain:'gol-gambeta-golero.firebaseapp.com',projectId:'gol-gambeta-golero',storageBucket:'gol-gambeta-golero.firebasestorage.app',messagingSenderId:'193720348697',appId:'1:193720348697:web:d82e064d08426726d3fa88'});
const auth=getAuth(app),db=getFirestore(app),hostUID='z6LqXbHCxTVqAphhooRJTgQEPvj1',players={'rmjRhJTZahRJJbIhQoUWX3iuMlS2':'Negro','I0fHIKrrgPTX7g7n3RJJlmueFsi1':'Flaco','7WqPOGLpoeQlOCM6UKJf78UPUtk2':'Gordis'},lobby=doc(db,'games','lobby'),$=id=>document.getElementById(id);

'Gol-3':[['¿Quién marcó el gol de la final del Mundial 2014?','Mario Götze|Gotze'],['¿Quién marcó el gol de la final del Mundial 2010?','Andrés Iniesta|Iniesta']],

'Gambeta-3':[['¿Qué jugador ganó la Champions con Ajax, Real Madrid y Milan?','Clarence Seedorf|Seedorf'],['¿Qué entrenador ganó el Mundial 2006?','Marcello Lippi|Lippi']],
'Gambeta-5':[['¿Qué club ganó la primera Champions bajo ese nombre en 1993?','Olympique de Marsella|Marsella|Marseille'],['¿Qué jugador ganó el Balón de Oro 1995?','George Weah|Weah']],

'Bonus-10':[['¿Quién ganó tres Mundiales como jugador?','Pelé|Edson Arantes do Nascimento'],['¿Qué selección ganó la Eurocopa 1992?','Dinamarca']]};
let user,host=false,state={},gameRef,selected,busy=false,stopLobby=()=>{},stopGame=()=>{},stopAnswers=()=>{},answerDocs=[],gradingId=null,submitted=false,bankIndex={},audio,lastTick=null;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim().replace(/\s+/g,' ');const fail=e=>$('message').textContent=e.message;const locked=()=>['open','grading'].includes(state.status);function beep(freq=600){try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}function action(id,fn){$(id).onclick=async()=>{if(busy)return;busy=true;$('message').textContent='';try{await fn()}catch(e){fail(e)}finally{busy=false}}}
action('enter',async()=>{beep();await signInWithEmailAndPassword(auth,$('role').value+'@ggg.example',$('password').value);$('password').value=''});action('logout',()=>signOut(auth));
function loadQuestion(next=false){if(!selected)return;const list=bank[selected.key];let i=bankIndex[selected.key]??Math.floor(Math.random()*list.length);if(next)i=(i+1)%list.length;bankIndex[selected.key]=i;[$('prompt').value,$('solution').value]=list[i]}
function choose(c,p){selected={category:c,points:p,key:c+'-'+p};$('selected').textContent=c+' · '+p+' puntos';loadQuestion();$('prompt').focus()}
action('random',()=>loadQuestion(true));
function board(){ $('board').replaceChildren();for(const c of ['Gol','Gambeta','Golero']){const h=document.createElement('strong');h.textContent=c;$('board').append(h)}for(const p of [1,3,5])for(const c of ['Gol','Gambeta','Golero']){const b=document.createElement('button'),used=(state.used||[]).includes(c+'-'+p);b.className='tile'+(used?' used':'');b.textContent=used?'✓':p;b.disabled=!host||!gameRef||locked()||used;b.onclick=()=>choose(c,p);$('board').append(b)}$('bonus').disabled=!host||!gameRef||locked()||(state.used||[]).includes('Bonus-10')}
$('bonus').onclick=()=>choose('Bonus',10);
function render(){const scores=Object.entries(state.scores||{Negro:0,Flaco:0,Gordis:0}).sort((a,b)=>b[1]-a[1]);$('scores').replaceChildren();for(const [name,points] of scores){const d=document.createElement('div'),n=document.createElement('strong'),s=document.createElement('div');n.textContent=name;s.className='score';s.textContent=points;d.append(n,s);$('scores').append(d)}$('round').textContent=`FECHA · ${state.used?.length||0}/10 preguntas completadas`;$('question').textContent=state.prompt||'Esperando una partida';$('category').textContent=state.activeKey||'';$('player').hidden=host||state.status!=='open';$('reveal').textContent=state.status==='closed'&&state.reveal?'Solución: '+state.reveal:'';$('open').disabled=locked();$('close').disabled=state.status!=='open';$('reset').disabled=locked();$('podium').textContent=state.used?.length===10?'🏆 '+scores.filter(x=>x[1]===scores[0][1]).map(x=>x[0]).join(' y ')+' · '+scores[0][1]+' puntos':'';board();if(host)showAnswers()}
function showAnswers(){if(state.status==='grading')return;const el=$('answers');el.replaceChildren();for(const a of answerDocs.filter(a=>a.questionId===state.activeQuestionId)){const p=document.createElement('p');p.textContent=players[a.uid]+': '+a.answer;el.append(p)}$('grade').hidden=true}
onAuthStateChanged(auth,async u=>{stopLobby();stopGame();stopAnswers();state={};gameRef=null;selected=null;answerDocs=[];gradingId=null;submitted=false;user=u;$('login').hidden=!!u;$('game').hidden=!u;if(!u)return;host=u.uid===hostUID;if(!host&&!players[u.uid]){await signOut(auth);return}$('identity').textContent=host?'Conductor':players[u.uid];$('host').hidden=!host;render();stopLobby=onSnapshot(lobby,s=>{stopGame();stopAnswers();if(!s.exists()){gameRef=null;state={};render();return}gameRef=doc(db,'games',s.data().gameId);stopGame=onSnapshot(gameRef,g=>{const old=state.activeQuestionId;state=g.data()||{};$('connection').textContent=g.metadata.fromCache?'Sin conexión / caché':'● Conectado';if(old!==state.activeQuestionId){submitted=false;gradingId=null;$('sent').textContent='';$('response').value='';$('answers').replaceChildren();if(!host&&state.activeQuestionId)getDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid)).then(d=>{if(d.exists()&&d.data().questionId===state.activeQuestionId){submitted=true;$('sent').textContent='Respuesta enviada'}}).catch(()=>{})}render();if(host&&state.status==='grading')prepareGrade().catch(fail)},fail);if(host)stopAnswers=onSnapshot(collection(gameRef,'answers'),s=>{answerDocs=s.docs.map(d=>d.data());showAnswers()},fail)},fail)});
action('reset',async()=>{if(!host||locked()||!confirm('¿Crear una partida nueva?'))return;const id=crypto.randomUUID();await setDoc(doc(db,'games',id),{status:'waiting',prompt:'Elegí una categoría',scores:{Negro:0,Flaco:0,Gordis:0},used:[]});await setDoc(lobby,{gameId:id});selected=null;$('selected').textContent='Elegí una casilla';$('prompt').value='';$('solution').value=''});
action('open',async()=>{if(!host||!gameRef||!selected)throw Error('Creá una partida y elegí una categoría.');const prompt=$('prompt').value.trim(),solutions=$('solution').value.split('|').map(norm).filter(Boolean),seconds=Number($('seconds').value),choice={...selected},id=crypto.randomUUID();if(!prompt||!solutions.length||!Number.isFinite(seconds)||seconds<5||seconds>300)throw Error('Completá los campos.');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(['open','grading'].includes(g.status)||g.used.includes(choice.key))throw Error('Casilla no disponible.');tx.set(doc(db,'questions',id),{solutions});tx.update(gameRef,{status:'open',prompt,activeQuestionId:id,points:choice.points,activeKey:choice.key,deadline:Timestamp.fromMillis(Date.now()+seconds*1000),duration:seconds,reveal:''})});selected=null;$('selected').textContent='Pregunta abierta';$('prompt').value='';$('solution').value='';beep(800)});
action('send',async()=>{if(host||!gameRef||state.status!=='open'||submitted||Date.now()>=state.deadline.toMillis())return;const answer=$('response').value.trim();if(!answer)return;await setDoc(doc(gameRef,'answers',state.activeQuestionId+'_'+user.uid),{uid:user.uid,questionId:state.activeQuestionId,answer,submittedAt:serverTimestamp()});submitted=true;$('sent').textContent='Respuesta enviada';$('response').value='';beep()});
action('close',async()=>{if(!host||!gameRef)return;const id=state.activeQuestionId;await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(g.status!=='open'||g.activeQuestionId!==id)throw Error('Pregunta cerrada.');tx.update(gameRef,{status:'grading'})});await prepareGrade()});
let valid=[],awards={};async function prepareGrade(){const id=state.activeQuestionId;if(!host||state.status!=='grading'||gradingId===id)return;gradingId=id;try{const q=await getDoc(doc(db,'questions',id)),snap=await getDocs(collection(gameRef,'answers'));if(state.activeQuestionId!==id)return;valid=q.data().solutions;awards={};$('answers').replaceChildren();const heading=document.createElement('p');heading.textContent='Solución: '+valid.join(' / ');$('answers').append(heading);for(const [uid,name] of Object.entries(players)){const a=snap.docs.map(d=>d.data()).find(a=>a.questionId===id&&a.uid===uid),row=document.createElement('div');row.className='answer';const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';check.checked=!!a&&valid.includes(norm(a.answer));check.disabled=!a;awards[name]=check.checked;check.onchange=()=>awards[name]=check.checked;label.append(check,document.createTextNode(' '+name+': '+(a?.answer||'Sin respuesta')));row.append(label);$('answers').append(row)}$('grade').hidden=false}catch(e){gradingId=null;throw e}}
action('grade',async()=>{if(!host||state.status!=='grading'||gradingId!==state.activeQuestionId)return;const id=gradingId,chosen={...awards},solution=valid.join(' / ');await runTransaction(db,async tx=>{const g=(await tx.get(gameRef)).data();if(g.status!=='grading'||g.activeQuestionId!==id)throw Error('Corrección ya realizada.');const scores={...g.scores};for(const n in chosen)if(chosen[n])scores[n]+=g.points;tx.update(gameRef,{scores,status:'closed',used:[...g.used,g.activeKey],reveal:solution})});beep(950)});
setInterval(()=>{const open=state.status==='open',remaining=Math.max(0,Math.ceil(((state.deadline?.toMillis()||0)-Date.now())/1000));$('clock').textContent=open?(remaining?remaining+' s':'¡Tiempo!'):'';$('bar').hidden=!open;$('bar').max=state.duration||30;$('bar').value=remaining;$('send').disabled=!open||remaining===0||submitted;if(open&&remaining!==lastTick&&remaining<=5&&lastTick!==null)beep(remaining?440:220);lastTick=open?remaining:null},250);
</script></html>
